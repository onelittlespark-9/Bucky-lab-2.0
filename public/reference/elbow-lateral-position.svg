<rect x="185" y="170" width="720" height="610" rx="24" fill="#111c24" stroke="#50697a" stroke-width="5"/><rect x="215" y="200" width="660" height="550" rx="12" fill="#172632" stroke="#2e4658" stroke-width="2"/>
