<g font-family="Arial" font-size="23" fill="#eaf5fb"><rect x="32" y="205" width="300" height="112" rx="14" fill="#092038" stroke="#4fbaf0"/><text x="52" y="241">Shoulder lowered so humerus,</text><text x="52" y="273">elbow and wrist are on the</text><text x="52" y="305">same horizontal plane</text><rect x="32" y="390" width="300" height="112" rx="14" fill="#092038" stroke="#4fbaf0"/><text x="52" y="426">Medial aspect of the arm</text><text x="52" y="458">rests on the detector/table;</text><text x="52" y="490">do not stand the humerus up</text><rect x="760" y="190" width="305" height="112" rx="14" fill="#092038" stroke="#4fbaf0"/><text x="780" y="226">Elbow flexed to exactly 90°</text><text x="780" y="258">in the plane of the detector</text><text x="780" y="290">— a horizontal L-shape</text><rect x="760" y="610" width="305" height="112" rx="14" fill="#092038" stroke="#4fbaf0"/><text x="780" y="646">Palm vertical to tabletop,</text><text x="780" y="678">thumb uppermost; true lateral</text><text x="780" y="710">wrist/forearm</text><rect x="330" y="745" width="430" height="94" rx="14" fill="#092038" stroke="#4fbaf0"/><text x="350" y="780">Elbow joint centred on detector; CR to lateral epicondyle.</text><text x="350" y="814">Correct side marker laterally, clear of anatomy.</text></g>
