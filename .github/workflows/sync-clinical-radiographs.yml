name: Persist reviewed radiograph assets

on:
  push:
    branches: [main]
    paths:
      - 'src/core/real-radiograph-manifest.json'
      - 'scripts/prepare-clinical-radiographs.mjs'
      - 'scripts/prepare-learning-anatomy.mjs'
      - 'src/core/anatomy-image-sources.json'
      - 'src/core/learning-photo-sources.json'
      - 'scripts/prepare-learning-photos.mjs'
      - 'scripts/create-exposure-demonstrations.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify licensed images
        run: node scripts/prepare-clinical-radiographs.mjs
      - name: Download and verify real Learning anatomy
        run: node scripts/prepare-learning-anatomy.mjs
      - name: Download authentic X-ray room photography
        run: node scripts/prepare-learning-photos.mjs
      - name: Build qualitative comparison for exposure learning
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/create-exposure-demonstrations.py
      - name: Commit reviewed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/clinical-reference/*.jpg public/clinical-reference/*.png
          if git diff --cached --quiet; then
            echo "Clinical images already versioned."
          else
            git commit -m "Store verified CC0 radiograph assets for reference library"
            git push origin HEAD:main
          fi
